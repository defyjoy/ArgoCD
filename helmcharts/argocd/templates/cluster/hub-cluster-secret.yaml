{{- if .Values.hubClusterSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: hub
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-name: hub
    environment: hub

    istio-network: network-management
    app.kubernetes.io/name: hub-cluster
    app.kubernetes.io/component: cluster-secret
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: Helm

    gateway-api-crds: "true"
    cilium: "true"
    cert-manager: "true"
    stepca: "true"
    external-secrets: "true"
    longhorn: "true"
    vcluster: "true"

    nats: "true"
    kube-prometheus-stack: "true"
    cloudflared: "true"
    external-dns: "true"
    kyverno: "true"
    victoria-metrics-operator: "true"
    victoria-metrics: "true"
    istio-base: "true"
    istiod: "true"
    istio-cni: "true"
    ztunnel: "true"
    # kiali: "true"
    tempo: "true"
    istio-gateway: "true"
    # istio-cacerts: "true"
    # plane: "true"

    ## Never deployed on any cluster -- these two were previously carried in `data.labels`,
    ## which Argo CD's cluster generator does not read (it selects on metadata.labels only),
    ## so their ApplicationSets have always matched zero clusters. Charts are still current
    ## (helmcharts/airflow, helmcharts/argo-workflows). Uncomment to actually deploy.
    # airflow: "true"
    # argo-workflows: "true"
  annotations:
    argocd.argoproj.io/managed: "true"
type: Opaque
data:
  server: {{ printf "https://kubernetes.default.svc" | b64enc }}
  # Deliberately still "local", not "hub" -- this is Argo CD's cluster name variable, which every
  # ApplicationSet template uses to name its generated Application (and therefore the Helm
  # release). Renaming it would rename every Helm release on this cluster (local-tempo,
  # local-nats, ...) -- a rename here would orphan any stateful release's live data, not migrate
  # it. Only the label-level identity (cluster-name/environment below) is "hub"; the underlying
  # Argo CD cluster name and every derived resource name stays "local" until that migration is
  # done deliberately.
  name: {{ printf "local" | b64enc }}
  tlsServerName: {{ printf "kubernetes.default.svc" | b64enc }}
  config: {{ printf `{"tlsClientConfig":{"insecure":false}}` | b64enc }}
{{- end }}
