gateway:
  addresses:
    - type: IPAddress
      value: 192.168.7.10

  externalDns:
    target: c935e6a5-731b-4b34-a322-fd7658b60dfc.cfargotunnel.com

  tls:
    enabled: true
    secretName: home-arpa-tls
    dnsNames:
      - "*.home.arpa"
      - "home.arpa"

  envListeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: home-arpa-tls
