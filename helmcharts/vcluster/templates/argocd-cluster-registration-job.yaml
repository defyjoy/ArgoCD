{{- if .Values.clusterRegistration.enabled }}
{{- $release := .Release.Name }}
{{- $ns := .Release.Namespace }}
{{- $argocdNs := .Values.clusterRegistration.argocdNamespace }}
{{- $saName := printf "%s-argocd-register" $release | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: vcluster
    app.kubernetes.io/component: argocd-cluster-registration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: vcluster
    app.kubernetes.io/component: argocd-cluster-registration
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "vc-%s" $release | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: vcluster
    app.kubernetes.io/component: argocd-cluster-registration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ $ns | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $argocdNs | quote }}
  labels:
    app.kubernetes.io/name: vcluster
    app.kubernetes.io/component: argocd-cluster-registration
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $argocdNs | quote }}
  labels:
    app.kubernetes.io/name: vcluster
    app.kubernetes.io/component: argocd-cluster-registration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-argocd-reg" $release | trunc 52 | trimSuffix "-" | quote }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: vcluster
    app.kubernetes.io/component: argocd-cluster-registration
  annotations:
    # Same wave as the vcluster StatefulSet (no explicit wave = "0"): the vc-<release> admin
    # secret exists as soon as the syncer starts, before the control plane is fully Ready, so
    # this doesn't need to wait a whole extra wave -- the retry loop below covers the gap.
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vcluster
        app.kubernetes.io/component: argocd-cluster-registration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName | quote }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: {{ .Values.clusterRegistration.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/.kube-cache
            - name: RELEASE
              value: {{ $release | quote }}
            - name: VCLUSTER_NS
              value: {{ $ns | quote }}
            - name: ARGOCD_NS
              value: {{ $argocdNs | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                TOKEN_B64="$(kubectl get secret -n "$VCLUSTER_NS" "vc-$RELEASE" -o jsonpath='{.data.token}' 2>/dev/null || true)"
                CA_B64="$(kubectl get secret -n "$VCLUSTER_NS" "vc-$RELEASE" -o jsonpath='{.data.certificate-authority}' 2>/dev/null || true)"
                if [ -n "$TOKEN_B64" ] && [ -n "$CA_B64" ]; then
                  break
                fi
                echo "waiting for $VCLUSTER_NS/vc-$RELEASE token+certificate-authority..."
                sleep 5
              done
              if [ -z "${TOKEN_B64:-}" ] || [ -z "${CA_B64:-}" ]; then
                echo "$VCLUSTER_NS/vc-$RELEASE never produced a token/CA" >&2
                exit 1
              fi
              TOKEN="$(printf '%s' "$TOKEN_B64" | base64 -d)"
              SERVER="https://${RELEASE}.${VCLUSTER_NS}.svc.cluster.local"
              CONFIG="$(printf '{"bearerToken":"%s","tlsClientConfig":{"insecure":false,"serverName":"%s","caData":"%s"}}' "$TOKEN" "$RELEASE" "$CA_B64")"
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${RELEASE}-cluster
                namespace: ${ARGOCD_NS}
                labels:
                  argocd.argoproj.io/secret-type: cluster
                  app.kubernetes.io/name: vcluster
                  app.kubernetes.io/component: argocd-cluster-registration
                  vcluster-name: ${RELEASE}
              type: Opaque
              stringData:
                name: ${RELEASE}
                server: ${SERVER}
                config: |
                  ${CONFIG}
              EOF
              echo "Registered ArgoCD cluster '${RELEASE}' (${SERVER})"
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
