{{- if .Values.corednsKubeSystem.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    home.arpa:53 {
        errors
        log . {
            class error
        }
        hosts {
            # argocd.home.arpa -> cilium-gateway's hub LoadBalancer IP (helmcharts/cilium/values/hub.yaml).
            192.168.7.10 argocd.home.arpa

            # dev cluster's own istio-gateway (192.168.5.11, see
            # helmcharts/istio/istio-gateway/values/dev.yaml). dev-echo.home.arpa is the
            # Phase 4 ACME HTTP-01 validation hostname for dev-gateway-cert -- without
            # this record, Step CA (resolving via this same LAN DNS) can never reach
            # dev's gateway to validate the challenge, and the Certificate hangs
            # forever waiting on authorization.
            192.168.5.11 dev-echo.home.arpa
            fallthrough
        }
        cache 300
    }

    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 192.168.1.100 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
{{- end }}