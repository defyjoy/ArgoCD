enabled: true

gateway:
  name: cilium-gateway
  namespace: cilium-gateway

  commonListeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

  # Per-cluster overlay (values/<environment>.yaml) appends its own TCP/TLS listeners here.
  # Must default to [] rather than being omitted -- gateway.yaml's `concat` helper errors on nil.
  envListeners: []
