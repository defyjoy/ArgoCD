hubClusterSecret:
  enabled: false

corednsKubeSystem:
  enabled: false

argo-cd:
  server:
    httproute:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1024Mi
  repoServer:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
