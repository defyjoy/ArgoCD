apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.providers.infrastructure.namespace | quote }}
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/component: infrastructure-provider
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.proxmoxCredentials.secretName | quote }}
  namespace: {{ .Values.providers.infrastructure.namespace | quote }}
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/component: proxmox-credentials
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: {{ .Values.proxmoxCredentials.secretName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  # Env-var-style keys: this Secret is consumed by the InfrastructureProvider's `configSecret`,
  # which the operator injects into the capmox controller-manager's environment verbatim --
  # CAPMOX reads PROXMOX_URL/PROXMOX_TOKEN/PROXMOX_SECRET, not arbitrary field names.
  data:
    - secretKey: PROXMOX_URL
      remoteRef:
        key: {{ .Values.proxmoxCredentials.externalSecrets.vaultPath | quote }}
        property: url
    - secretKey: PROXMOX_TOKEN
      remoteRef:
        key: {{ .Values.proxmoxCredentials.externalSecrets.vaultPath | quote }}
        property: token_id
    - secretKey: PROXMOX_SECRET
      remoteRef:
        key: {{ .Values.proxmoxCredentials.externalSecrets.vaultPath | quote }}
        property: token_secret
