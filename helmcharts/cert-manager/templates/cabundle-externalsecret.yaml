{{- $job := .Values.stepCaAcmeClusterIssuer.caBundlePatchJob }}
{{- if and .Values.enabled .Values.stepCaAcmeClusterIssuer.enabled $job.enabled (eq $job.source "secret") $job.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-stepca-root-ca-bundle" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $job.secret.namespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
  annotations:
    # Before the cabundle-patch Job (wave 5) needs this Secret to exist.
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: {{ $job.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $job.externalSecret.secretStore | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $job.secret.name | quote }}
    creationPolicy: Owner
  data:
    - secretKey: root_ca.crt
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $job.externalSecret.vaultPath | quote }}
        metadataPolicy: None
        property: root_ca.crt
    - secretKey: intermediate_ca.crt
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $job.externalSecret.vaultPath | quote }}
        metadataPolicy: None
        property: intermediate_ca.crt
{{- end }}
