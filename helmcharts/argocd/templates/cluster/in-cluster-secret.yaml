{{- with .Values.inClusterSecret }}
{{- if .enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: cluster-{{ .name }}
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-name: {{ .name }}
    environment: {{ .environment }}
type: Opaque
stringData:
  name: {{ .name }}
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
{{- end }}
{{- end }}
