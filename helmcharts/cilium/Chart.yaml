apiVersion: v2
name: cilium
description: >-
  Wrapper chart for Cilium as the cluster CNI + kube-proxy replacement + LoadBalancer
  (LB-IPAM / L2 announcement), replacing Flannel and kube-proxy.
  See alarmify-docs: docs/cilium/cilium-migration-plan.md and
  docs/infrastructure/adr-009-cilium-cni-loadbalancer-migration.md.

type: application

# Wrapper chart version (this repo's packaging). Bump on template/values changes here.
version: 0.1.0

# Pinned Cilium version. 1.20.x is the first Cilium line that supports Kubernetes 1.35 (stable
# 1.19.x tops out at 1.34). Must match the `cilium_version` Terraform installs in
# proxmox-talos/terraform/envs/hub/.auto.tfvars (currently 1.20.2, GA) -- Terraform does the
# one-time initial install on a fresh cluster (chicken-and-egg: no CNI, no Argo CD either), and
# Argo CD takes over reconciling the same release from here on. A version mismatch here doesn't
# just drift silently: Argo CD's automated sync actively downgrades/upgrades the live DaemonSet
# to whatever this chart pins, every time it reconciles.
appVersion: "1.20.2"

dependencies:
  - name: cilium
    version: "1.20.2"
    repository: https://helm.cilium.io
    condition: enabled
