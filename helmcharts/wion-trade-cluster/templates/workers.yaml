# Field names verified 2026-10-04 against the live CRD, see templates/control-plane.yaml.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ printf "%s-worker-%s" .Values.clusterName .Values.templateRevision | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: worker
spec:
  template:
    spec:
      sourceNode: {{ .Values.proxmox.sourceNode | quote }}
      templateID: {{ .Values.proxmox.templateID }}
      checks:
        skipQemuGuestAgent: true
      numSockets: {{ .Values.worker.numSockets }}
      numCores: {{ .Values.worker.numCores }}
      memoryMiB: {{ .Values.worker.memoryMiB }}
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: {{ .Values.proxmox.disk.sizeGiB }}
      network:
        networkDevices:
          - name: net0
            bridge: {{ .Values.proxmox.network.bridge | quote }}
            model: {{ .Values.proxmox.network.model | quote }}
            defaultIPv4: true
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ printf "%s-worker-%s" .Values.clusterName .Values.templateRevision | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: worker
spec:
  template:
    spec:
      generateType: join
      talosVersion: {{ .Values.talosVersion | quote }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ printf "%s-worker" .Values.clusterName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: worker
    cluster.x-k8s.io/cluster-name: {{ .Values.clusterName | quote }}
spec:
  clusterName: {{ .Values.clusterName | quote }}
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ .Values.clusterName | quote }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ .Values.clusterName | quote }}
        app.kubernetes.io/component: worker
    spec:
      clusterName: {{ .Values.clusterName | quote }}
      version: {{ .Values.kubernetesVersion | quote }}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: {{ printf "%s-worker-%s" .Values.clusterName .Values.templateRevision | quote }}
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: {{ printf "%s-worker-%s" .Values.clusterName .Values.templateRevision | quote }}
