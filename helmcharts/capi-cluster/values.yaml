templateRevision: "1"

kubernetesVersion: v1.33.2
talosVersion: v1.14.2

proxmox:
  templateID: 9000
  pool: ""
  network:
    bridge: vmbr0
    model: virtio
  disk:
    sizeGiB: 40

controlPlane:
  replicas: 1
  numSockets: 1
  numCores: 2
  memoryMiB: 4096

worker:
  replicas: 1
  numSockets: 1
  numCores: 2
  memoryMiB: 4096

network:
  gateway: 192.168.0.1
  prefix: 16
  dnsServers:
    - 192.168.1.100

credentialsRef:
  externalSecrets:
    vaultPath: wion-hub/hub/cluster-api/proxmox-credentials

machineHealthCheck:
  nodeStartupTimeoutSeconds: 600
  unhealthyConditionTimeoutSeconds: 300

registrationJob:
  kubectlImage: docker.io/alpine/k8s:1.31.13
  argocdNamespace: argocd
