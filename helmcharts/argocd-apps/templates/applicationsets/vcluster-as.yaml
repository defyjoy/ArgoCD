# vCluster ApplicationSet
# Deploys one named vcluster instance per (cluster x list-entry) pair. The clusters generator
# gates on the `vcluster: "true"` label (see helmcharts/argocd/templates/cluster/hub-cluster-secret.yaml)
# so only opted-in clusters get vclusters; the list generator enumerates the actual named
# instances. Add a new vcluster by adding an element here -- never by editing a live Secret.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vcluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  vcluster: "true"
          - list:
              elements:
                - vclusterName: stayozo-hub
                  vclusterNamespace: vcluster-stayozo-hub
                - vclusterName: wion-hub
                  vclusterNamespace: vcluster-wion-hub

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-{{vclusterName}}-vcluster"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: vcluster
        app.kubernetes.io/instance: {{ `"{{vclusterName}}"` }}
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        vcluster-name: {{ `"{{vclusterName}}"` }}
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default

      source:
        repoURL: git@github.com:defyjoy/ArgoCD.git
        targetRevision: HEAD
        path: helmcharts/vcluster
        helm:
          valueFiles:
            - values.yaml
            - {{ `"values/{{vclusterName}}.yaml"` }}
          ignoreMissingValueFiles: true

      destination:
        server: {{ `"{{server}}"` }}
        namespace: {{ `"{{vclusterNamespace}}"` }}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

        managedNamespaceMetadata:
          labels:
            name: {{ `"{{vclusterNamespace}}"` }}
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
          annotations:
            argocd.argoproj.io/managed: "true"

      ignoreDifferences:
        # StatefulSet persistentVolumeClaimRetentionPolicy.whenScaled defaults to Retain in Kubernetes
        # even though the chart only explicitly sets whenDeleted; volumeClaimTemplates may change at runtime
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.persistentVolumeClaimRetentionPolicy.whenScaled
            - .spec.volumeClaimTemplates
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
        - group: ""
          kind: Service
          jqPathExpressions:
            - .metadata.annotations

      revisionHistoryLimit: 10
