inClusterSecret:
  enabled: true
  name: stayozo-hub
  environment: stayozo-hub

argo-cd:
  global:
    domain: stayozo.argocd.home.arpa
  server:
    httproute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: cilium-gateway
          namespace: cilium-gateway
          sectionName: http
      hostnames:
        - stayozo.argocd.home.arpa
