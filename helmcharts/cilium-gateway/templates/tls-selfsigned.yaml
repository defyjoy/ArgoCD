{{- if .Values.gateway.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cilium-gateway-selfsigned
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/name: cilium-gateway
    app.kubernetes.io/component: gateway
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.tls.secretName }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/name: cilium-gateway
    app.kubernetes.io/component: gateway
spec:
  secretName: {{ .Values.gateway.tls.secretName }}
  issuerRef:
    name: cilium-gateway-selfsigned
    kind: Issuer
  dnsNames:
    {{- toYaml .Values.gateway.tls.dnsNames | nindent 4 }}
{{- end }}
