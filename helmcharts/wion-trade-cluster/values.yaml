clusterName: wion-trade
namespace: wion-trade
templateRevision: "8"

kubernetesVersion: v1.33.2
talosVersion: v1.14.2

controlPlaneEndpoint:
  host: 192.168.9.10
  port: 6443

proxmox:
  sourceNode: pve01
  templateID: 9000
  pool: ""
  network:
    bridge: vmbr0
    model: virtio
  disk:
    sizeGiB: 40

controlPlane:
  replicas: 1
  numSockets: 1
  numCores: 2
  memoryMiB: 4096

worker:
  replicas: 1
  numSockets: 1
  numCores: 2
  memoryMiB: 4096

network:
  gateway: 192.168.0.1
  prefix: 16
  dnsServers:
    - 192.168.1.100
  ipv4Addresses:
    - 192.168.9.20-192.168.9.29

credentialsRef:
  secretName: wion-trade-proxmox-credentials
  externalSecrets:
    vaultPath: wion-trade/hub/cluster-api/proxmox-credentials

registrationJob:
  kubectlImage: docker.io/alpine/k8s:1.31.13
  argocdNamespace: argocd
