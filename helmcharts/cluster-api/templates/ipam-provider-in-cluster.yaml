apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.providers.ipam.namespace | quote }}
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/component: ipam-provider
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: IPAMProvider
metadata:
  name: {{ .Values.providers.ipam.name | quote }}
  namespace: {{ .Values.providers.ipam.namespace | quote }}
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/component: ipam-provider
spec:
  version: {{ .Values.providers.ipam.version | quote }}
