apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - dev
                - hub
                - wion-hub
                - wion-trade
                - stayozo
                - stayozo-hub
            - key: cilium
              operator: In
              values:
                - "true"
        values:
          # hub is a Talos cluster (confirmed live: node-local apiserver proxy on :7445, NIC
          # ens18) -- NOT k3s. This is a single static value shared by every cluster this
          # generator matches; if a k3s cluster is ever added, this needs to become a per-cluster
          # label (like `environment`) instead of a hardcoded generator value.
          distro: talos

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-cilium"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{metadata.labels.environment}}"` }}
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "."
        argocd.argoproj.io/sync-wave: "-20"
    spec:
      project: default

      source:
        repoURL: git@github.com:defyjoy/ArgoCD.git
        targetRevision: HEAD
        path: helmcharts/cilium
        helm:
          valueFiles:
            - values.yaml
            - {{ `"values/distro/{{values.distro}}.yaml"` }}
            - {{ `"values/{{metadata.labels.environment}}.yaml"` }}
          ignoreMissingValueFiles: true

      destination:
        server: {{ `"{{server}}"` }}
        namespace: kube-system

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 8
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 5m

      revisionHistoryLimit: 3
