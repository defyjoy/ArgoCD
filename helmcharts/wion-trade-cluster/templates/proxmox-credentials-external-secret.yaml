apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: cluster
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.credentialsRef.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: proxmox-credentials
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: {{ .Values.credentialsRef.secretName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  # Lowercase keys -- this is ProxmoxCluster.spec.credentialsRef's Secret, a different shape
  # from helmcharts/cluster-api's env-var-shaped provider-level configSecret. Same Vault path,
  # different `property` mapping; see that chart's README for why they can't be conflated.
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.credentialsRef.externalSecrets.vaultPath | quote }}
        property: url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: token
      remoteRef:
        key: {{ .Values.credentialsRef.externalSecrets.vaultPath | quote }}
        property: token_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret
      remoteRef:
        key: {{ .Values.credentialsRef.externalSecrets.vaultPath | quote }}
        property: token_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
