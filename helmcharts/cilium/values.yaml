enabled: true

cilium:
  kubeProxyReplacement: true

  ipam:
    mode: kubernetes

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  cni:
    exclusive: false
  socketLB:
    hostNamespaceOnly: true

  l2announcements:
    enabled: true
  externalIPs:
    enabled: true
  k8sClientRateLimit:
    qps: 50
    burst: 100

  operator:
    replicas: 1
    rollOutPods: true
    skipCRDCreation: true
  hubble:
    enabled: false

  gatewayAPI:
    enabled: true
    enableAlpn: true
    # "auto" depends on Argo's cached API list for the target cluster; a stale cache
    # dropped the GatewayClass from the render and prune deleted it on wion-hub.
    gatewayClass:
      create: "true"

loadBalancer:
  enabled: true
  poolName: default-pool
  addresses: []
