# Generic Cluster API workload-cluster ApplicationSet, one Application per entry in the
# `list` generator below, all sharing `helmcharts/capi-cluster` and differing only by
# `values/<clusterName>.yaml`. Gated on `capi-clusters: "true"` (hub-cluster-secret.yaml) and
# ordered after cluster-api-as.yaml (sync-wave 4) so the InfrastructureProvider/
# BootstrapProvider/ControlPlaneProvider CRDs each cluster needs already exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: capi-clusters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  capi-clusters: "true"
          - list:
              elements:
                - clusterName: wion-hub
                - clusterName: wion-trade
                - clusterName: stayozo-hub
                - clusterName: stayozo

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{clusterName}}-capi-cluster"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{metadata.labels.environment}}"` }}
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/ArgoCD.git
        targetRevision: HEAD
        path: helmcharts/capi-cluster
        helm:
          valueFiles:
            - values.yaml
            - {{ `"values/{{clusterName}}.yaml"` }}
          ignoreMissingValueFiles: true
      destination:
        server: {{ `"{{server}}"` }}
        namespace: {{ `"{{clusterName}}"` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 3
