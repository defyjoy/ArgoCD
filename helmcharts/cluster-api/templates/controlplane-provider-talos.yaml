apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.providers.controlPlane.namespace | quote }}
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/component: controlplane-provider
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: {{ .Values.providers.controlPlane.name | quote }}
  namespace: {{ .Values.providers.controlPlane.namespace | quote }}
  labels:
    app.kubernetes.io/name: cluster-api
    app.kubernetes.io/component: controlplane-provider
spec:
  version: {{ .Values.providers.controlPlane.version | quote }}
