externalSecrets:
  enabled: false
  vaultPath: alarmify/hub/cloudflared/credentials

dns:
  cfargotunnelTarget: c935e6a5-731b-4b34-a322-fd7658b60dfc.cfargotunnel.com
  records:
    - hostname: vault.workquark.org

cloudflared:
  tunnelConfig:
    name: "hub"

  ingress:
    - hostname: vault.workquark.org
      service: https://192.168.0.102:8200
      originRequest:
        noTLSVerify: true
    - service: http_status:404
