{{- if and .Values.enabled .Values.stepCaAcmeClusterIssuer.enabled .Values.stepCaAcmeClusterIssuer.caBundlePatchJob.enabled }}
{{- $s := .Values.stepCaAcmeClusterIssuer }}
{{- $job := $s.caBundlePatchJob }}
{{- $issuer := $s.clusterIssuerName }}
{{- $cmNamespace := $s.stepcaNamespace }}
{{- $cmName := printf "%s-step-certificates-certs" $s.stepcaHelmReleaseName }}
{{- $saName := printf "%s-acme-cabundle-patch" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
---
{{- if eq $job.source "configmap" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-acme-cabundle-read-src" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $cmNamespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $cmName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-acme-cabundle-read-src" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $cmNamespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-acme-cabundle-read-src" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-acme-cabundle-read-src" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $job.secret.namespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $job.secret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-acme-cabundle-read-src" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $job.secret.namespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-acme-cabundle-read-src" .Release.Name | trunc 63 | trimSuffix "-" | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-stepca-acme-cabundle-patch" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames: [{{ $issuer | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-stepca-acme-cabundle-patch" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-stepca-acme-cabundle-patch" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-acme-cab" .Release.Name | trunc 52 | trimSuffix "-" | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: step-ca-acme-cabundle-patch
  annotations:
    # Same wave as the ClusterIssuer (4), NOT later: ArgoCD won't advance to a later wave until
    # the current one is Synced+Healthy, and the ClusterIssuer can only ever become Healthy once
    # this Job patches its caBundle -- a later wave here deadlocks any ClusterIssuer that starts
    # out unhealthy (e.g. a fresh cluster) since the fix would be gated behind the failure it
    # fixes. Same-wave resources apply together without that health gate between them; the
    # retry loop below (up to 10 minutes) covers the ConfigMap/Secret source not being ready yet.
    argocd.argoproj.io/sync-wave: "4"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/component: step-ca-acme-cabundle-patch
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName | quote }}
      volumes:
        - name: sync-tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: {{ $job.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: sync-tmp
              mountPath: /tmp
          env:
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/.kube-cache
            - name: ISSUER
              value: {{ $issuer | quote }}
            {{- if eq $job.source "configmap" }}
            - name: SRC_NS
              value: {{ $cmNamespace | quote }}
            - name: SRC_NAME
              value: {{ $cmName | quote }}
            {{- else }}
            - name: SRC_NS
              value: {{ $job.secret.namespace | quote }}
            - name: SRC_NAME
              value: {{ $job.secret.name | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              for i in $(seq 1 120); do
                {{- if eq $job.source "configmap" }}
                ROOT="$(kubectl get configmap -n "$SRC_NS" "$SRC_NAME" -o jsonpath='{.data.root_ca\.crt}' 2>/dev/null || true)"
                {{- else }}
                ROOT="$(kubectl get secret -n "$SRC_NS" "$SRC_NAME" -o jsonpath='{.data.root_ca\.crt}' 2>/dev/null | base64 -d || true)"
                {{- end }}
                if printf '%s' "$ROOT" | grep -q "BEGIN CERTIFICATE"; then
                  break
                fi
                echo "waiting for $SRC_NS/$SRC_NAME root_ca.crt..."
                sleep 5
              done
              if ! printf '%s' "$ROOT" | grep -q "BEGIN CERTIFICATE"; then
                echo "$SRC_NS/$SRC_NAME root_ca.crt still missing" >&2
                exit 1
              fi
              {{- if eq $job.source "configmap" }}
              INT="$(kubectl get configmap -n "$SRC_NS" "$SRC_NAME" -o jsonpath='{.data.intermediate_ca\.crt}' 2>/dev/null || true)"
              {{- else }}
              INT="$(kubectl get secret -n "$SRC_NS" "$SRC_NAME" -o jsonpath='{.data.intermediate_ca\.crt}' 2>/dev/null | base64 -d || true)"
              {{- end }}
              BUNDLE="$ROOT"
              if printf '%s' "$INT" | grep -q "BEGIN CERTIFICATE"; then
                BUNDLE="$(printf '%s\n%s\n' "$ROOT" "$INT")"
              fi
              B64="$(printf '%s' "$BUNDLE" | base64 | tr -d '\n')"
              kubectl patch clusterissuer "$ISSUER" --type=merge -p "{\"spec\":{\"acme\":{\"caBundle\":\"${B64}\"}}}"
              echo "Patched ClusterIssuer $ISSUER with Step CA trust bundle (root + intermediate when present)"
{{- end }}
