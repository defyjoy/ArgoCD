---
# HTTPRoute for Airflow
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: api-server
spec:
  hostnames:
    - airflow.{{ .Values.domain }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: cilium-gateway
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: cilium-gateway
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ printf "%s-api-server" .Release.Name | quote }}
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

