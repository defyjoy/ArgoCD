# One address per pool, one pool per machine role -- CAPMOX reports whatever address its IPAM
# claim gets back as Machine.status.addresses (it can't see Talos's real in-guest IP, since
# Talos doesn't implement QEMU guest agent), and CACPPT/CABPT use that status field to know
# where to connect for bootstrap/health checks. A single-address pool per role makes the IPAM
# claim deterministic and forces it to equal the exact static IP the Talos strategicPatches
# below also configure in-guest -- so both halves agree on the same address. Confirmed live
# 2026-10-04: a shared multi-address pool let the claim and the real Talos IP diverge
# (status.addresses showed a different pool address than what Talos actually bound to eth0),
# and TalosControlPlane/KCP bootstrap could never reach the node as a result.
apiVersion: ipam.cluster.x-k8s.io/v1alpha2
kind: InClusterIPPool
metadata:
  name: {{ printf "%s-control-plane" .Values.clusterName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: control-plane
spec:
  addresses:
    - {{ .Values.controlPlane.ip | quote }}
  gateway: {{ .Values.network.gateway | quote }}
  prefix: {{ .Values.network.prefix }}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha2
kind: InClusterIPPool
metadata:
  name: {{ printf "%s-worker" .Values.clusterName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: wion-trade-cluster
    app.kubernetes.io/component: worker
spec:
  addresses:
    - {{ .Values.worker.ip | quote }}
  gateway: {{ .Values.network.gateway | quote }}
  prefix: {{ .Values.network.prefix }}
