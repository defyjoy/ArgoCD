# Cluster API management plane. Gated on its own `cluster-api: "true"` label (declared in
# helmcharts/argocd/templates/cluster/hub-cluster-secret.yaml) rather than `environment`, same
# as the removed vcluster-as.yaml's `vcluster: "true"` gate -- this installs the CAPI
# operator + providers once, on hub, regardless of how many workload clusters it later manages.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-api: "true"

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-cluster-api"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{metadata.labels.environment}}"` }}
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/ArgoCD.git
        targetRevision: HEAD
        path: helmcharts/cluster-api
        helm:
          valueFiles:
            - values.yaml
            - {{ `"values/{{metadata.labels.environment}}.yaml"` }}
          ignoreMissingValueFiles: true
      destination:
        server: {{ `"{{server}}"` }}
        namespace: capi-operator-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 3
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .metadata.annotations."force-sync"
        # cluster-api-operator's CRDs ship a conversion webhook with a literal placeholder
        # caBundle ("Cg==" -- just a newline, not valid PEM). cert-manager-cainjector patches
        # it with the real cert right after creation, but ArgoCD's git-rendered manifest still
        # carries the placeholder -- a jqPathExpressions-only ignore just masks drift *after* a
        # successful apply, it doesn't stop ArgoCD from trying to re-assert the placeholder
        # (which the API server then rejects outright: "unable to parse bytes as PEM block").
        # managedFieldsManagers makes ArgoCD cede this field to cainjector's SSA ownership
        # instead, so it never attempts to write it in the first place.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.webhookClientConfig.caBundle
          managedFieldsManagers:
            - cert-manager-cainjector
